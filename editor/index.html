<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture Studio</title>
  <link rel="stylesheet" href="./studio.css">
  <script type="module" src="./studio.mjs"></script>
</head>
<body>
  <header>
    <h1>Capture Studio</h1>
    <nav aria-label="Capture mode">
      <button type="button" data-mode="code" aria-pressed="true">Code</button>
      <button type="button" data-mode="chat" aria-pressed="false">Conversation</button>
      <button type="button" data-mode="window" aria-pressed="false">Window</button>
    </nav>
    <button id="export" type="button" disabled>Export PNG</button>
  </header>
  <main>
    <section class="controls" aria-label="Capture settings">
      <div data-section="code" class="fields">
        <label>Filename <input id="filename" placeholder="example.ts" maxlength="90"></label>
        <label>Language
          <select id="language">
            <option value="auto">From filename</option>
            <option value="javascript">JavaScript / TypeScript</option>
            <option value="json">JSON</option>
            <option value="python">Python</option>
            <option value="shell">Shell</option>
            <option value="text">Plain text</option>
          </select>
        </label>
        <label class="check"><input id="line-numbers" type="checkbox" checked> Line numbers</label>
        <label>First line <input id="first-line" type="number" value="1" min="1" max="999999"></label>
        <label>Code <textarea id="code" rows="10" spellcheck="false" maxlength="20000" placeholder="Paste the selected lines from Orca"></textarea></label>
      </div>
      <div data-section="chat" class="fields" hidden>
        <label>Conversation title <input id="chat-title" placeholder="Agent conversation" maxlength="90"></label>
        <div id="messages"></div>
        <button id="add-message" type="button">Add message</button>
        <template id="message-template">
          <fieldset class="message">
            <legend></legend>
            <div class="message-heading">
              <label>Speaker
                <select class="speaker"><option>You</option><option>Agent</option></select>
              </label>
              <button type="button" class="remove">Remove</button>
            </div>
            <label>Message <textarea rows="4" maxlength="16000" placeholder="Paste a prompt or reply"></textarea></label>
          </fieldset>
        </template>
      </div>
      <div data-section="window" class="fields" hidden>
        <button id="choose-image" type="button">Open screenshot</button>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <button id="paste-target" type="button">Focus to paste screenshot</button>
        <p class="hint">On macOS, run <strong>Capture Studio: Capture Window to Clipboard</strong> from Orca’s command palette first.</p>
        <label>Redaction
          <select id="redaction">
            <option value="solid">Solid cover</option>
            <option value="blur">Blur</option>
          </select>
        </label>
        <p class="hint">Drag over the chat or code in the preview.</p>
        <div class="history"><button id="undo" type="button" disabled>Undo</button><button id="clear" type="button" disabled>Clear redactions</button></div>
      </div>
      <label id="theme-field">Image theme
        <select id="theme"><option value="dark">Midnight</option><option value="light">Daylight</option></select>
      </label>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="preview" aria-label="Export preview">
      <div class="preview-bar"><span>Preview</span><output id="dimensions"></output></div>
      <div class="stage" id="stage" tabindex="0">
        <p id="empty">Paste code to start.</p>
        <canvas id="image" aria-label="Capture preview" hidden></canvas>
      </div>
    </section>
  </main>
</body>
</html>
